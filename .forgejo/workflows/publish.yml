name: Publish package

# Real publishes only happen for tags (v*). A manual run is a dry run, so a
# maintainer can validate packaging without uploading anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.6"

      - name: Tests, leak scan and syntax checks
        run: npm run check

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match package version $version. Bump package.json or retag."
            exit 1
          fi

      - name: Dry run (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npm pack --dry-run

      - name: Publish to the pvlb.dev Forgejo npm registry
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty. Add a repository Actions secret NPM_TOKEN with a Forgejo token that has the write:package scope."
            exit 1
          fi
          registry="https://git.pvlb.dev/api/packages/dsh-plugins/npm/"
          version="$(node -p "require('./package.json').version")"
          npm config set registry "$registry"
          npm config set "//git.pvlb.dev/api/packages/dsh-plugins/npm/:_authToken" "$NODE_AUTH_TOKEN"
          if npm view "dsh-gitea@$version" version >/dev/null 2>&1; then
            echo "dsh-gitea@$version is already in the Forgejo registry; skipping."
            exit 0
          fi
          npm publish --registry "$registry"
