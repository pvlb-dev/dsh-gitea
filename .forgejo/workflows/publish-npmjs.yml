name: Publish to npmjs

# Publishes the same tagged artifact to the public npm registry, using npm's
# staged publishing: CI stages the version with the stage-only `NPMJS_TOKEN`
# (granular token, "read and write (stage only)"), then a maintainer approves
# it with 2FA — `npm stage approve <stage-id>` or the package page on npmjs.
# npm rejects a direct `npm publish` with a stage-only token (EOTP).
# Skipped automatically while the NPMJS_TOKEN secret is absent.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `npm stage` needs npm >= 11.15.0 and Node >= 22.14.0; the bundled npm
      # can lag, so install a known-good npm explicitly.
      - name: Set up npm for staged publishing
        run: |
          npm install -g npm@12
          npm --version

      - name: Tests, leak scan and syntax checks
        run: npm run check

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match package version $version. Bump package.json or retag."
            exit 1
          fi

      - name: Stage the version on npmjs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPMJS_TOKEN is not set; skipping the public npm stage."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          npm config set registry https://registry.npmjs.org/
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          if npm view "dsh-gitea@$version" version >/dev/null 2>&1; then
            echo "dsh-gitea@$version is already on npmjs; nothing to do."
            exit 0
          fi
          npm stage publish
          echo "::notice::Staged dsh-gitea@$version on npmjs. A maintainer must approve it with 2FA (npm stage approve <stage-id>, or the package page on npmjs.com) before it is published."
