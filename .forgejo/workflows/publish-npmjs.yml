name: Publish to npmjs

# Publishes the same tagged artifact to the public npm registry. Skipped
# automatically while the NPMJS_TOKEN secret is absent, so the Forgejo release
# path stays independent. The unscoped name `dsh-gitea` is ours; the first run
# with a token claims it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.6"

      - name: Tests, leak scan and syntax checks
        run: npm run check

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match package version $version. Bump package.json or retag."
            exit 1
          fi

      - name: Publish to npmjs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPMJS_TOKEN is not set; skipping the public npm publish."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          npm config set registry https://registry.npmjs.org/
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          if npm view "dsh-gitea@$version" version >/dev/null 2>&1; then
            echo "dsh-gitea@$version is already on npmjs; nothing to do."
            exit 0
          fi
          npm publish
